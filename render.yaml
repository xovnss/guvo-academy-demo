# Despliegue en Render (plan gratuito): New → Blueprint → elige este repositorio.
services:
  - type: web
    name: guvo-academy-demo
    runtime: node
    plan: free
    buildCommand: echo "sin dependencias de ejecución"
    startCommand: npm start
    healthCheckPath: /api/scenarios
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: CERT_SECRET
        generateValue: true
